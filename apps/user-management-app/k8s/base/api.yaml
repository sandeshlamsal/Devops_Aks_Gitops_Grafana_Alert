# user-management-app-api — Node.js. Talks to Postgres (DATABASE_URL from the CNPG secret) and
# signs JWTs with JWT_SECRET (from OpenBao via ESO, Secret user-management-app-jwt).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-app-api
  labels: { app: user-management-app-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-management-app-api }
  template:
    metadata:
      labels: { app: user-management-app-api }
    spec:
      containers:
        - name: api
          image: user-management-app-api:v1        # overlay rewrites to the ACR path + tag
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: PORT
              value: "8080"
            - name: APP_ENV
              value: base                 # overlay patch sets dev / qa
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: user-management-app-db-app, key: uri }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: user-management-app-jwt, key: secret }
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              # traces only (src/tracing.js) — the collector fans them out to Tempo.
              # See infrastructure/observability/.
              value: "http://otel-collector.monitoring.svc:4318"
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-management-app-api
  labels: { app: user-management-app-api }
spec:
  selector: { app: user-management-app-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Prometheus scrapes /metrics on the API — the same operator-discovery pattern used across this repo.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-management-app-api
  labels: { release: kube-prom-stack }
spec:
  selector:
    matchLabels: { app: user-management-app-api }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
