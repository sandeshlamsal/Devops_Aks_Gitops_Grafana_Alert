# JWT signing secret, out of git. ESO creates Secret `user-management-app-jwt` in this
# namespace; the API mounts it as JWT_SECRET.
#
# The remoteRef.key below (jwt) is a placeholder — every overlay MUST patch it to its
# own per-environment path (jwt-dev / jwt-qa / jwt-prod, see overlays/*/patch.yaml).
# Environments used to share one signing secret here; a token minted by logging into
# dev was cryptographically valid against qa and prod too. Never point two
# environments at the same key.
#
# Seed once per environment:
#   bao kv put kv/user-management-app/jwt-<env> secret="$(openssl rand -hex 32)"
# (the eso-monitoring policy already allows read on all of kv/data/user-management-app/*
#  — see infrastructure/secrets/README.md — so no policy change is needed per env.)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-management-app-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: user-management-app-jwt
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: user-management-app/jwt
        property: secret
