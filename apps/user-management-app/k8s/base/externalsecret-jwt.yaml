# JWT signing secret, out of git. ESO reads OpenBao kv/user-management-app/jwt (field: secret)
# and creates Secret `user-management-app-jwt` in this namespace; the API mounts it as JWT_SECRET.
# Seed once per cluster:  bao kv put kv/user-management-app/jwt secret='<random-64-char-string>'
# (the eso-monitoring policy must also allow read on kv/data/user-management-app/* — see
#  infrastructure/secrets/README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-management-app-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: user-management-app-jwt
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: user-management-app/jwt
        property: secret
