# dev-specific values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-app-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: APP_ENV
              value: dev
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-app-ui
spec:
  template:
    spec:
      containers:
        - name: ui
          env:
            - name: APP_ENV
              value: dev
---
# so seedUsers() knows this is dev — see api/src/seed.js's DEV_ONLY_USERS
apiVersion: batch/v1
kind: Job
metadata:
  name: user-management-app-db-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: APP_ENV
              value: dev
---
apiVersion: v1
kind: Service
metadata:
  name: user-management-app-ui
  annotations:
    # → user-management-dev.eastus2.cloudapp.azure.com  (stable public URL)
    service.beta.kubernetes.io/azure-dns-label-name: user-management-dev
---
# own JWT signing secret — see base/externalsecret-jwt.yaml's header comment for why
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-management-app-jwt
spec:
  data:
    - secretKey: secret
      remoteRef:
        key: user-management-app/jwt-dev
        property: secret
---
# dev's own backup container — see base/objectstore.yaml's header comment for the
# azure-storage-creds Secret this depends on (created once, manually, not in git)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: user-management-app-db-store
spec:
  configuration:
    destinationPath: "https://sanpgbackupsdev.blob.core.windows.net/postgres-backups-dev"
---
# dev's namespace substituted into both SLOs' queries — objective (99.99 / 95) is
# unchanged from base/slo.yaml; only dev's PrometheusServiceLevel is unenforced
# (SRE/04-deployment-gating.md only checks prod's alert output)
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: user-management-app-api
spec:
  service: "user-management-app-api"
  labels:
    app: user-management-app-api
  slos:
    - name: "availability"
      objective: 99.99
      description: "Proportion of requests that do not return 5xx"
      sli:
        events:
          errorQuery: sum(rate(http_request_duration_seconds_count{status=~"5..",namespace="user-management-app-dev-ns"}[{{"{{.window}}"}}]))
          totalQuery: sum(rate(http_request_duration_seconds_count{namespace="user-management-app-dev-ns"}[{{"{{.window}}"}}]))
      alerting:
        name: UserManagementAppApiAvailabilityBudgetBurn
        labels:
          service: user-management-app-api
          slo: availability
        annotations:
          summary: "user-management-app-api is burning its availability error budget too fast"
        pageAlert:
          labels:
            severity: page
        ticketAlert:
          labels:
            severity: ticket
    - name: "latency"
      objective: 95
      description: "Proportion of requests served in under 300ms"
      sli:
        events:
          errorQuery: sum(rate(http_request_duration_seconds_count{namespace="user-management-app-dev-ns"}[{{"{{.window}}"}}])) - sum(rate(http_request_duration_seconds_bucket{le="0.3",namespace="user-management-app-dev-ns"}[{{"{{.window}}"}}]))
          totalQuery: sum(rate(http_request_duration_seconds_count{namespace="user-management-app-dev-ns"}[{{"{{.window}}"}}]))
      alerting:
        name: UserManagementAppApiLatencyBudgetBurn
        labels:
          service: user-management-app-api
          slo: latency
        annotations:
          summary: "user-management-app-api is burning its latency error budget too fast"
        pageAlert:
          labels:
            severity: page
        ticketAlert:
          labels:
            severity: ticket
