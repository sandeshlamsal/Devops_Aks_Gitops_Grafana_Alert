# dev overlay → namespace user-management-app-dev-ns. Reconciled by clusters/dev/user-management-app-dev.yaml.
#
# newTag below is bumped automatically by ci.yml's bump-dev job on every push to main
# (commits directly, no PR — dev is the one environment nothing gates). qa and prod
# are promoted manually instead, via a release PR (apps/user-management-app/k8s/overlays/{qa,prod}/).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: user-management-app-dev-ns
resources:
  - namespace.yaml
  - ../../base
images:
  - name: user-management-app-api
    newName: sanaksregistry.azurecr.io/user-management-app-api
    newTag: dev-30
  - name: user-management-app-ui
    newName: sanaksregistry.azurecr.io/user-management-app-ui
    newTag: dev-30
patches:
  - path: patch.yaml
