# qa-specific values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-app-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: APP_ENV
              value: qa
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-app-ui
spec:
  template:
    spec:
      containers:
        - name: ui
          env:
            - name: APP_ENV
              value: qa
---
apiVersion: v1
kind: Service
metadata:
  name: user-management-app-ui
  annotations:
    # → user-management-qa.eastus2.cloudapp.azure.com
    service.beta.kubernetes.io/azure-dns-label-name: user-management-qa
---
# own JWT signing secret — see base/externalsecret-jwt.yaml's header comment for why
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-management-app-jwt
spec:
  data:
    - secretKey: secret
      remoteRef:
        key: user-management-app/jwt-qa
        property: secret
