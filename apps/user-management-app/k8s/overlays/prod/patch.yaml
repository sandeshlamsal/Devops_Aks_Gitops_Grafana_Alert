# prod-specific values: 2 API replicas (small HA touch), APP_ENV=prod, public DNS label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-app-api
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: api
          env:
            - name: APP_ENV
              value: prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-app-ui
spec:
  template:
    spec:
      containers:
        - name: ui
          env:
            - name: APP_ENV
              value: prod
---
apiVersion: batch/v1
kind: Job
metadata:
  name: user-management-app-db-migrate
spec:
  template:
    spec:
      containers:
        - name: migrate
          env:
            - name: APP_ENV
              value: prod
---
apiVersion: v1
kind: Service
metadata:
  name: user-management-app-ui
  annotations:
    # → user-management-prod.eastus2.cloudapp.azure.com
    service.beta.kubernetes.io/azure-dns-label-name: user-management-prod
---
# own JWT signing secret — see base/externalsecret-jwt.yaml's header comment for why
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-management-app-jwt
spec:
  data:
    - secretKey: secret
      remoteRef:
        key: user-management-app/jwt-prod
        property: secret
---
# prod's own backup container — see base/objectstore.yaml's header comment for the
# azure-storage-creds Secret this depends on (created once, manually, not in git)
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: user-management-app-db-store
spec:
  configuration:
    destinationPath: "https://CHANGEME.blob.core.windows.net/postgres-backups-prod"
