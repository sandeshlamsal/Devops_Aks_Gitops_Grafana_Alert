# dev-specific values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-login-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: APP_ENV
              value: dev
---
apiVersion: v1
kind: Service
metadata:
  name: user-login-ui
  annotations:
    # → userdir-dev.eastus2.cloudapp.azure.com  (stable public URL)
    service.beta.kubernetes.io/azure-dns-label-name: userdir-dev
