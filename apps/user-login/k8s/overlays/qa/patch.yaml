# qa-specific values.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-login-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: APP_ENV
              value: qa
---
apiVersion: v1
kind: Service
metadata:
  name: user-login-ui
  annotations:
    # → userlogin-qa.eastus2.cloudapp.azure.com
    service.beta.kubernetes.io/azure-dns-label-name: userlogin-qa
