# Per-namespace DB reset: drops & recreates the `public` schema, re-migrates, re-seeds.
# Shipped SUSPENDED with a never-fires schedule — it exists only to be triggered on
# demand, in one namespace at a time:
#
#   kubectl -n userlogin-dev-ns create job db-reset-$(date +%s) --from=cronjob/userlogin-db-reset
#   kubectl -n userlogin-dev-ns logs -f job/db-reset-<...>
#
# (Implemented as a suspended CronJob rather than a bare Job so `--from` gives you a
# fresh, repeatable run every time without editing anything.)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: userlogin-db-reset
spec:
  schedule: "0 0 31 2 *"        # 31 February — never runs on its own
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reset
              image: user-login-api:v1    # overlay rewrites to the ACR path + tag
              command: ["sh", "-c", "node src/migrate.js --reset && node src/seed.js"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: { name: userlogin-db-app, key: uri }
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 200m, memory: 192Mi }
