# Base for the user-login app: db (CNPG Cluster) + api + ui + jwt secret + the
# migrate Job and the suspended reset CronJob. Namespace + image tags + per-env
# values come from the overlays.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret-jwt.yaml
  - db-cluster.yaml
  - db-migrate-job.yaml
  - db-reset-cronjob.yaml
  - api.yaml
  - ui.yaml
