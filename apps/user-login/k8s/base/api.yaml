# user-login-api — Node.js. Talks to Postgres (DATABASE_URL from the CNPG secret) and
# signs JWTs with JWT_SECRET (from OpenBao via ESO, Secret userlogin-jwt).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-login-api
  labels: { app: user-login-api }
spec:
  replicas: 1
  selector:
    matchLabels: { app: user-login-api }
  template:
    metadata:
      labels: { app: user-login-api }
    spec:
      containers:
        - name: api
          image: user-login-api:v1        # overlay rewrites to the ACR path + tag
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: PORT
              value: "8080"
            - name: APP_ENV
              value: base                 # overlay patch sets dev / qa
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: userlogin-db-app, key: uri }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: userlogin-jwt, key: secret }
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: user-login-api
  labels: { app: user-login-api }
spec:
  selector: { app: user-login-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Prometheus scrapes /metrics on the API — same operator-discovery pattern as nginx-demo.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: user-login-api
  labels: { release: kube-prom-stack }
spec:
  selector:
    matchLabels: { app: user-login-api }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
