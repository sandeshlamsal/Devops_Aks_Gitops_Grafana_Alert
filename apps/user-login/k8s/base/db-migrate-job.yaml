# Runs on every deploy: applies pending SQL migrations then seeds fixtures (both
# idempotent). Retries until the CNPG Cluster's -rw service answers.
# The force annotation makes Flux delete+recreate the Job whenever its spec changes
# (Jobs are otherwise immutable) — so a new image or migration re-runs it.
apiVersion: batch/v1
kind: Job
metadata:
  name: userlogin-db-migrate
  annotations:
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: user-login-api:v1        # overlay rewrites to the ACR path + tag
          command: ["sh", "-c", "node src/migrate.js && node src/seed.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: userlogin-db-app, key: uri }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 192Mi }
