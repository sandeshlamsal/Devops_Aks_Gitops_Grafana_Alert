# JWT signing secret, out of git. ESO reads OpenBao kv/userlogin/jwt (field: secret)
# and creates Secret `userlogin-jwt` in this namespace; the API mounts it as JWT_SECRET.
# Seed once per cluster:  bao kv put kv/userlogin/jwt secret='<random-64-char-string>'
# (the eso-monitoring policy must also allow read on kv/data/userlogin/* — see
#  infrastructure/secrets/README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: userlogin-jwt
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: userlogin-jwt
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: userlogin/jwt
        property: secret
