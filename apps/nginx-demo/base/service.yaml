# Exposes nginx (port 80) and the exporter metrics (port 9113). The ServiceMonitor
# scrapes the metrics port.
apiVersion: v1
kind: Service
metadata:
  name: nginx-demo-svc
  labels:
    app: nginx-demo
spec:
  type: LoadBalancer
  selector:
    app: nginx-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: metrics
      port: 9113
      targetPort: 9113
