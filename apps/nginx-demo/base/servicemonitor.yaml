# Tells the Prometheus Operator to scrape the nginx-demo exporter every 15s.
# No namespaceSelector — it scrapes the Service in its own namespace (nginx-dev-app-ns),
# so this works unchanged whatever namespace the overlay deploys into.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: nginx-demo
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app: nginx-demo
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
