# Dev overlay: the base plus a replica-count patch, pinned to the nginx-dev-app-ns
# namespace. This is the path Flux's "apps" Kustomization points at.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nginx-dev-app-ns
resources:
  - namespace.yaml
  - ../../base
patches:
  - path: replica-patch.yaml
