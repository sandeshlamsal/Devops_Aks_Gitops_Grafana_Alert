name: CI

# PRs: validate + test + build (no push) — a fast, safe check before merge.
# push to main: same, plus push the built api/ui images to ACR tagged dev-<run_number>
# and main-<sha>, then bump-dev commits that tag into the dev overlay using the
# default GITHUB_TOKEN — no manual tag edits, no PAT to create.
#
# (This used to be Flux Image Automation — an in-cluster controller watching ACR and
# committing the bump itself. That needed its own git-write credential, which is a
# real GitHub token tied to a real identity either way; a GitHub Actions job gets one
# for free, scoped to the job's own lifetime, with zero setup. Moved here instead —
# same job qa/prod's promote-*.yml already do for their own overlay bumps.)
#
# bump-dev goes through a branch + PR + squash-merge (via `gh pr merge`, i.e. the API)
# rather than `git push origin HEAD:main` directly — this repo's "Cant delete main"
# ruleset added a code_coverage rule that rejects any direct push to main ("Code
# coverage checks require merging via API or UI"), which silently broke the old
# direct-push version of this job (see PR-README.md). The squash commit still carries
# [skip ci] so merging it doesn't trigger another push-triggered CI run.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # azure/login OIDC — no stored Azure credentials

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install kustomize
        run: |
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz
          sudo mv kustomize /usr/local/bin/
      - name: kustomize build every overlay + infra kustomization
        run: |
          set -e
          for d in \
            apps/user-management-app/k8s/overlays/dev \
            apps/user-management-app/k8s/overlays/qa \
            apps/user-management-app/k8s/overlays/prod \
            infrastructure/prometheus \
            infrastructure/secrets/operator \
            infrastructure/secrets/openbao \
            infrastructure/secrets \
            infrastructure/grafana/operator \
            infrastructure/grafana \
            infrastructure/alert \
            infrastructure/cert-manager \
            infrastructure/cnpg \
            infrastructure/cnpg/tests/fixture-cluster \
          ; do
            echo "== $d =="
            kustomize build "$d" > /dev/null
          done

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: user_management_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appuser"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/user-management-app/api
    env:
      DATABASE_URL: postgres://appuser:pw@localhost:5432/user_management_app
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/user-management-app/api/package-lock.json
      - run: npm install --no-audit --no-fund
      - name: unit + integration tests (must pass before any image is built)
        run: npm test

  build:
    needs: [validate-manifests, test-api]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: user-management-app-api
            context: ./apps/user-management-app/api
          - image: user-management-app-ui
            context: ./apps/user-management-app/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build (PR — verify the Dockerfile only, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false

      - uses: azure/login@v2
        if: github.event_name == 'push'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: az acr login
        if: github.event_name == 'push'
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: build + push dev image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:dev-${{ github.run_number }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:main-${{ github.sha }}

      - name: scan the built image
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/${{ matrix.image }}:main-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "0"   # report only — flip to "1" once the baseline is clean

  bump-dev:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: bump dev overlay to dev-${{ github.run_number }}
        run: |
          curl -sL https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq -i '(.images[] | select(.name == "user-management-app-api") | .newTag) = strenv(TAG)' apps/user-management-app/k8s/overlays/dev/kustomization.yaml
          yq -i '(.images[] | select(.name == "user-management-app-ui")  | .newTag) = strenv(TAG)' apps/user-management-app/k8s/overlays/dev/kustomization.yaml
        env:
          TAG: dev-${{ github.run_number }}
      - name: commit + open PR + squash-merge (branch protection blocks a direct push)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- apps/user-management-app/k8s/overlays/dev/kustomization.yaml && { echo "no change, skipping"; exit 0; }
          BRANCH="bump-dev-${{ github.run_number }}"
          git checkout -b "$BRANCH"
          git add apps/user-management-app/k8s/overlays/dev/kustomization.yaml
          git commit -m "bump dev to dev-${{ github.run_number }}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "bump dev to dev-${{ github.run_number }}" \
            --body "Automated: points the dev overlay at the image just built and pushed by this CI run."
          # [skip ci] on the squash commit is a GitHub-native convention — this
          # merge's own push to main does NOT trigger another CI run, so there's no
          # bump-dev -> push -> bump-dev loop.
          gh pr merge "$BRANCH" --squash --delete-branch \
            --subject "bump dev to dev-${{ github.run_number }} [skip ci]"
