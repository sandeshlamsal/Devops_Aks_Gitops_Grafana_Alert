name: Release (build)

# Cutting a release = pushing a git tag vX.Y.Z. This ONLY builds, pushes and scans the
# api/ui images tagged with that version — it does not touch any overlay or cluster.
# Promoting a built version into an environment is a separate, explicit step:
# promote-dev.yml / promote-qa.yml / promote-prod.yml. That split is what lets the same
# built artifact be promoted to qa today and prod next week without rebuilding it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  build-release-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ vars.ACR_NAME }}
      - name: build + push api
        uses: docker/build-push-action@v6
        with:
          context: ./apps/user-management-app/api
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/user-management-app-api:${{ github.ref_name }}
      - name: build + push ui
        uses: docker/build-push-action@v6
        with:
          context: ./apps/user-management-app/ui
          push: true
          tags: ${{ vars.ACR_NAME }}.azurecr.io/user-management-app-ui:${{ github.ref_name }}
      - name: scan release images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.ACR_NAME }}.azurecr.io/user-management-app-api:${{ github.ref_name }}
          severity: CRITICAL,HIGH
          exit-code: "1"   # a release image failing on CRITICAL/HIGH blocks it going any further

      - name: next step
        run: |
          echo "Built and pushed ${{ github.ref_name }} for api + ui."
          echo "Promote it with the 'Promote to qa' or 'Promote to dev' workflow (Actions tab -> Run workflow -> version: ${{ github.ref_name }})."
