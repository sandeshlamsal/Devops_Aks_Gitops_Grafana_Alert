# WHY: same as user-login-dev, into userlogin-qa-ns from the qa overlay.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-login-qa
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/user-login/k8s/overlays/qa
  prune: true
  dependsOn:
    - name: cnpg-operator
    - name: secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
