# WHY: tells Flux to reconcile the nginx-demo app (deployment + service +
# ServiceMonitor) from its dev overlay into the `default` namespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/nginx-demo/overlays/dev
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: default
