# WHY: tells Flux to reconcile infrastructure/prometheus/ — the monitoring namespace
# and kube-prometheus-stack (Prometheus + Prometheus Operator + Alertmanager). The
# "grafana" and "alert" Kustomizations both dependsOn this.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/prometheus
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
