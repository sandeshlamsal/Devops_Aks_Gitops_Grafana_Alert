# WHY: installs OpenBao (the open-source secret store). Comes up sealed — a one-time
# `bao operator init` + unseal + policy/role setup is needed before ExternalSecrets can
# resolve (see infrastructure/secrets/README.md).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/secrets/openbao
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
