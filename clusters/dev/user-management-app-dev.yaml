# WHY: reconciles the user-management-app app (ui + api + CNPG Cluster + migrate Job +
# reset CronJob) into user-management-app-dev-ns. dependsOn cnpg-operator (Cluster CRD)
# and secrets (the user-management-app-jwt ExternalSecret needs ESO + OpenBao).
#
# suspend: true by default — dev deploys nothing until armed by the "Promote to dev"
# GitHub Actions workflow (.github/workflows/promote-dev.yml), which resumes this
# Kustomization. Flux Image Automation keeps the dev overlay's image tag current in
# git regardless of suspend state; suspend only gates whether that gets APPLIED.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-management-app-dev
  namespace: flux-system
spec:
  interval: 5m
  suspend: true
  path: ./apps/user-management-app/k8s/overlays/dev
  prune: true
  dependsOn:
    - name: cnpg-operator
    - name: secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
