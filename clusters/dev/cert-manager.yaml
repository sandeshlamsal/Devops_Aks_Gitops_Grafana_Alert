# WHY: installs cert-manager — a prerequisite for the CNPG Barman Cloud plugin
# (infrastructure/cnpg/barman-cloud-plugin.yaml), whose CNPG-I gRPC endpoint is served
# over TLS using a cert-manager-issued certificate. dependsOn nothing (cert-manager
# doesn't need anything else installed first).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/cert-manager
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
