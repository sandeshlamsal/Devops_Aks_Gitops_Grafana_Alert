# WHY: tells Flux to reconcile infrastructure/alert/ — the PrometheusRule alert rules
# and the AlertmanagerConfig email routing. dependsOn: prometheus (Prometheus,
# Alertmanager and their CRDs must exist first).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alert
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/alert
  prune: true
  dependsOn:
    - name: prometheus
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
