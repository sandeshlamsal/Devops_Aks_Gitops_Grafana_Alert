# WHY: installs the External Secrets Operator (+ its CRDs) as its own Flux Kustomization
# so the SecretStore / ExternalSecret CRs in the "secrets" Kustomization can be applied.
# Same CRD-ordering reason as grafana-operator.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/secrets/operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
