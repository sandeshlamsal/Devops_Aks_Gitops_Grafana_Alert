# WHY: installs the CloudNativePG operator (+ CRDs) as its own Flux Kustomization so the
# Cluster CRs in the user-login overlays can be applied. dependsOn nothing.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/cnpg
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
