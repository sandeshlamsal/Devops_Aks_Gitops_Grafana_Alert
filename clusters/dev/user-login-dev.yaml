# WHY: reconciles the user-login app (ui + api + CNPG Cluster + migrate Job + reset
# CronJob) into userlogin-dev-ns. dependsOn cnpg-operator (Cluster CRD) and secrets
# (the userlogin-jwt ExternalSecret needs ESO + OpenBao).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: user-login-dev
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/user-login/k8s/overlays/dev
  prune: true
  dependsOn:
    - name: cnpg-operator
    - name: secrets
  sourceRef:
    kind: GitRepository
    name: flux-system
