# WHY: tells Flux to reconcile infrastructure/grafana/ — the Grafana Operator, the
# Grafana instance + Prometheus datasource, and the dashboards. dependsOn: prometheus
# (the monitoring namespace and the Prometheus datasource target must exist first).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/grafana
  prune: true
  dependsOn:
    - name: prometheus
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
