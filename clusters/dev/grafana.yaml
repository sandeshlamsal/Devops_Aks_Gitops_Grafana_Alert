# WHY: tells Flux to reconcile infrastructure/grafana/ — the Grafana instance +
# Prometheus datasource + dashboards. dependsOn: grafana-operator (its CRDs must be
# registered first; that Kustomization in turn dependsOn prometheus).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/grafana
  prune: true
  dependsOn:
    - name: grafana-operator
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
