# WHY: installs the Grafana Operator (and its CRDs) as its own Flux Kustomization so it
# lands before anything that uses Grafana* CRs. dependsOn: prometheus (shared namespace).
# The "grafana" Kustomization dependsOn this one.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/grafana/operator
  prune: true
  wait: true
  dependsOn:
    - name: prometheus
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
