# WHY: applies the ClusterSecretStore (→ OpenBao) and the ExternalSecrets that
# materialise gmail-smtp-secret + grafana-admin into the `monitoring` namespace.
# dependsOn: external-secrets-operator (CRDs), openbao (backend), prometheus (creates
# the monitoring namespace). "grafana" and "alert" in turn dependsOn this.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/secrets
  prune: true
  dependsOn:
    - name: external-secrets-operator
    - name: openbao
    - name: prometheus
  sourceRef:
    kind: GitRepository
    name: flux-system
