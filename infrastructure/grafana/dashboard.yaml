# The nginx-demo dashboard: per-pod CPU, memory and restarts.
# The dashboard model is NOT inline here — it lives in json/nginx-demo.json and is
# bundled into the `grafana-dashboards` ConfigMap by kustomization.yaml. This CR just
# points the operator at that ConfigMap key.
#
# To change the dashboard: edit json/nginx-demo.json (or paste a fresh model exported
# from the Grafana UI), commit, push.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nginx-demo
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  resyncPeriod: 5m
  configMapRef:
    name: grafana-dashboards
    key: nginx-demo.json
