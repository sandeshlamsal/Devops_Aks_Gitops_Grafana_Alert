# The "Nginx Dashboard": per-pod CPU, memory and restarts, with a Namespace picker
# (dev / qa / any namespace running the app).
#
# The dashboard model is NOT inline here — it lives in json/nginx-demo.json and is
# bundled into the `grafana-dashboards` ConfigMap by kustomization.yaml. This CR points
# the operator at that ConfigMap key and files it under the "Custom Application
# Dashboards" folder (folder.yaml).
#
# To change the dashboard: edit json/nginx-demo.json (or paste a fresh model exported
# from the Grafana UI), commit, push.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nginx-demo
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folderRef: custom-application-dashboards
  resyncPeriod: 5m
  configMapRef:
    name: grafana-dashboards
    key: nginx-demo.json
