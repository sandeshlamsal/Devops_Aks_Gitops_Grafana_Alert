# The "User Management App" dashboard: per-pod CPU, memory and restarts, with a
# Namespace picker (dev / qa / prod / any namespace running the app).
#
# The dashboard model is NOT inline here — it lives in json/user-management-app.json
# and is bundled into the `grafana-dashboards` ConfigMap by kustomization.yaml. This CR
# points the operator at that ConfigMap key and files it under the "Custom Application
# Dashboards" folder (folder.yaml).
#
# To change the dashboard: edit json/user-management-app.json (or paste a fresh model
# exported from the Grafana UI), commit, push.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: user-management-app
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folderRef: custom-application-dashboards
  resyncPeriod: 1m
  configMapRef:
    name: grafana-dashboards
    key: user-management-app.json
