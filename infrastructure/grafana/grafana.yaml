# The Grafana instance + its Prometheus datasource, as CRs.
# The operator builds the Deployment and Service from this.
# Grafana is used for dashboards only — alerting/email is Prometheus + Alertmanager
# (see ../alert/), so there is no SMTP config here.
# The label dashboards: "grafana" is what dashboard.yaml selects on.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: "grafana"
spec:
  config:
    security:
      admin_user: admin
      admin_password: changeme123      # DEMO ONLY — the service below is a public LoadBalancer
    server:
      # Permanent shareable URL. The Azure DNS label on the Service (below) publishes
      # <label>.<region>.cloudapp.azure.com and keeps it pinned to the LB's public IP
      # even if the Service is recreated.
      domain: "nginx-demo-grafana.eastus2.cloudapp.azure.com"
      root_url: "http://nginx-demo-grafana.eastus2.cloudapp.azure.com/"
  service:
    # Public LoadBalancer with a stable Azure-managed hostname, listening on :80 so the
    # URL has no port suffix. For anything real: Secret-backed admin_password, and put
    # TLS/auth in front (ClusterIP + Ingress + cert-manager) — see the folder README.
    metadata:
      annotations:
        service.beta.kubernetes.io/azure-dns-label-name: "nginx-demo-grafana"
    spec:
      type: LoadBalancer
      ports:
        - name: grafana-http
          protocol: TCP
          port: 80
          targetPort: 3000
  persistentVolumeClaim:
    # A team-shared instance shouldn't lose its dashboards/datasource for a minute
    # every time grafana.yaml changes (config change → pod roll → fresh in-pod SQLite).
    # The operator mounts this PVC at /var/lib/grafana so state survives restarts.
    # Uses the cluster default StorageClass (Azure managed disk).
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Prometheus
    uid: prometheusdatasource
    type: prometheus
    access: proxy
    url: http://kube-prom-stack-kube-prome-prometheus.monitoring.svc:9090
    isDefault: true
