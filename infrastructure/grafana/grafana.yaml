# The Grafana instance + its Prometheus datasource, as CRs.
# The operator builds the Deployment and Service from this.
# Grafana is used for dashboards only — alerting/email is Prometheus + Alertmanager
# (see ../alert/), so there is no SMTP config here.
# The label dashboards: "grafana" is what dashboard.yaml selects on.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: "grafana"
spec:
  config:
    security:
      admin_user: admin
      # Resolved at runtime from env GF_SECURITY_ADMIN_PASSWORD, which comes from the
      # Secret "grafana-admin" that External Secrets Operator syncs out of OpenBao
      # (infrastructure/secrets/). Nothing sensitive in git.
      admin_password: $__env{GF_SECURITY_ADMIN_PASSWORD}
    server:
      # Permanent shareable URL. The Azure DNS label on the Service (below) publishes
      # <label>.<region>.cloudapp.azure.com and keeps it pinned to the LB's public IP
      # even if the Service is recreated.
      domain: "usermgmt-grafana.eastus2.cloudapp.azure.com"
      root_url: "http://usermgmt-grafana.eastus2.cloudapp.azure.com/"
  service:
    # Public LoadBalancer with a stable Azure-managed hostname, listening on :80 so the
    # URL has no port suffix. For anything real: Secret-backed admin_password, and put
    # TLS/auth in front (ClusterIP + Ingress + cert-manager) — see the folder README.
    metadata:
      annotations:
        service.beta.kubernetes.io/azure-dns-label-name: "usermgmt-grafana"
    spec:
      type: LoadBalancer
      ports:
        - name: grafana-http
          protocol: TCP
          port: 80
          targetPort: 3000
  persistentVolumeClaim:
    # A team-shared instance shouldn't lose its dashboards/datasource for a minute
    # every time grafana.yaml changes (config change → pod roll → fresh in-pod SQLite).
    # This creates PVC "grafana-pvc" (cluster default StorageClass / Azure managed disk).
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 2Gi
  deployment:
    spec:
      template:
        spec:
          # The Grafana image runs as uid/gid 472. An Azure managed-disk PV mounts
          # root-owned, so without fsGroup the container can't write /var/lib/grafana
          # and CrashLoopBackOffs.
          securityContext:
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
          containers:
            - name: grafana
              env:
                # admin password, synced from OpenBao by External Secrets Operator
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: password
          # The operator mounts a volume named "grafana-data" at /var/lib/grafana but
          # defaults it to emptyDir — repoint it at the PVC above so Grafana's SQLite
          # (dashboards, prefs) persists across pod restarts.
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Prometheus
    uid: prometheusdatasource
    type: prometheus
    access: proxy
    url: http://kube-prom-stack-kube-prome-prometheus.monitoring.svc:9090
    isDefault: true
