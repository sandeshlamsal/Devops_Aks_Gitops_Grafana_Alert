# The Grafana instance + its Prometheus datasource, as CRs.
# The operator builds the Deployment and Service from this.
# Grafana is used for dashboards only — alerting/email is Prometheus + Alertmanager
# (see ../alert/), so there is no SMTP config here.
# The label dashboards: "grafana" is what dashboard.yaml selects on.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: "grafana"
spec:
  config:
    security:
      admin_user: admin
      admin_password: changeme123      # DEMO ONLY — the service below is a public LoadBalancer
    server:
      root_url: "%(protocol)s://%(domain)s/"
  service:
    # Exposes Grafana on a public IP so the team can reach it without port-forward.
    # For anything real: change admin_password (use $__env{...} + a Secret) and/or
    # front it with auth, or switch back to ClusterIP + an Ingress.
    spec:
      type: LoadBalancer
  persistentVolumeClaim:
    # Grafana's default DB is SQLite inside the pod — wiped on every pod restart
    # (e.g. any config change), leaving dashboards missing until the operator's next
    # resync. A PVC keeps Grafana state across restarts. Uses the cluster default
    # StorageClass (Azure managed disk).
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Prometheus
    uid: prometheusdatasource
    type: prometheus
    access: proxy
    url: http://kube-prom-stack-kube-prome-prometheus.monitoring.svc:9090
    isDefault: true
