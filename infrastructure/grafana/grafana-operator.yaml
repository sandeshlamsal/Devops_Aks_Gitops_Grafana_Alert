# Installs the Grafana Operator via Flux. It reconciles the Grafana / GrafanaDatasource
# / GrafanaDashboard CRs in this folder (dashboards only — alerting is Prometheus).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/grafana/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: grafana-operator
      version: ">=5.0.0 <6.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: monitoring
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
