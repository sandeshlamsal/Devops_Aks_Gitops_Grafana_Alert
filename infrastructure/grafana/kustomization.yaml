# Applied by the Flux Kustomization "grafana" (clusters/dev/grafana.yaml), which
# dependsOn "grafana-operator" (its CRDs must exist first) and, through that,
# "prometheus". The operator install itself is in operator/ — a separate Kustomization,
# NOT referenced here.
#
# configMapGenerator turns every file in json/ into the `grafana-dashboards` ConfigMap
# (one key per file). disableNameSuffixHash keeps the name stable so dashboard.yaml
# can reference it. Add a dashboard: drop json/<name>.json, list it under files:, and
# add a GrafanaDashboard block in dashboard.yaml with key: <name>.json.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - grafana.yaml
  - folder.yaml
  - dashboard.yaml
configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - json/nginx-demo.json
generatorOptions:
  disableNameSuffixHash: true
