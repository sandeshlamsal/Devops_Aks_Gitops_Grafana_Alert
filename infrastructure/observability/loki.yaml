# Grafana Loki — logs. SingleBinary deploy mode (one pod, filesystem storage on a PVC):
# right-sized for this demo, same pattern as OpenBao/Grafana/CNPG elsewhere in this repo.
# Grafana Alloy (alloy.yaml) ships logs here; the "Loki" GrafanaDatasource
# (datasource-loki.yaml) is how you query them from Grafana.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: loki
      version: ">=6.0.0 <7.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-charts
        namespace: monitoring
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      storage:
        type: filesystem
      limits_config:
        retention_period: 168h   # 7 days — plenty for a demo, keeps the PVC small
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 5Gi
      resources:
        requests: { cpu: 50m, memory: 256Mi }
        limits: { cpu: 500m, memory: 512Mi }
    # disable the multi-component / HA pieces the chart supports but this demo doesn't use
    read: { replicas: 0 }
    write: { replicas: 0 }
    backend: { replicas: 0 }
    gateway: { enabled: false }
    minio: { enabled: false }
    test: { enabled: false }
    lokiCanary: { enabled: false }
    monitoring:
      selfMonitoring: { enabled: false }
      lokiCanary: { enabled: false }
      serviceMonitor: { enabled: false }
    chunksCache: { enabled: false }
    resultsCache: { enabled: false }
