# image-reflector-controller needs its own credentials to list tags via the ACR REST
# API (separate from the node kubelet's pull auth via --attach-acr). Uses a scoped ACR
# token (pull-only, revocable) — not the ACR admin account. Create once:
#
#   az acr token create --registry <ACR_NAME> --name flux-pull-token \
#       --scope-map _repositories_pull --query "credentials.passwords[0].value" -o tsv
#   bao kv put kv/flux/acr-pull username='flux-pull-token' password='<token value>'
#
# ESO templates a dockerconfigjson Secret (the type ImageRepository.spec.secretRef
# expects) from the two OpenBao fields.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: acr-credentials
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: acr-credentials
    creationPolicy: Owner
    template:
      engine: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"sanaksregistry.azurecr.io":{"username":"{{ .username }}","password":"{{ .password }}","auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: flux/acr-pull
        property: username
    - secretKey: password
      remoteRef:
        key: flux/acr-pull
        property: password
