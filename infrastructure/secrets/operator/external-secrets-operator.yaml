# External Secrets Operator (ESO) — https://external-secrets.io  (Apache-2.0, CNCF).
# It watches SecretStore / ClusterSecretStore / ExternalSecret CRs and syncs values
# FROM OpenBao INTO native Kubernetes Secrets. So the repo only ever contains
# references, never secret material.
#
# Its own Flux Kustomization ("external-secrets-operator") because it ships CRDs that
# the CRs in ../stores and ../externalsecrets depend on — same split as grafana-operator.
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  type: oci
  interval: 1h
  url: oci://ghcr.io/external-secrets/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 30m
  chart:
    spec:
      chart: external-secrets
      version: ">=0.10.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: external-secrets
  install:
    crds: CreateReplace
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    installCRDs: true
    replicaCount: 1
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits:   { cpu: 100m, memory: 192Mi }
    webhook:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { cpu: 50m, memory: 96Mi }
    certController:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits:   { cpu: 50m, memory: 96Mi }
