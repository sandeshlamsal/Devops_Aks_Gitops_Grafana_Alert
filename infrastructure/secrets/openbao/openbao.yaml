# OpenBao — https://openbao.org  (MPL-2.0, Linux Foundation; the open-source fork of
# HashiCorp Vault after Vault went BSL). API-compatible with Vault, so the External
# Secrets Operator's `vault` provider talks to it unchanged.
#
# This is a single-node "standalone" deployment with file storage on a PVC. It comes up
# SEALED and must be initialised + unsealed once by hand after first install
# (see ../README.md → "Bootstrap OpenBao"). For production use `server.ha` + Raft +
# auto-unseal (Azure Key Vault / transit).
#
# Its own Flux Kustomization ("openbao"). Namespace: openbao.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: ">=0.10.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: openbao
  values:
    server:
      image:
        repository: quay.io/openbao/openbao
      standalone:
        enabled: true
        config: |
          ui = true
          listener "tcp" {
            address     = "[::]:8200"
            tls_disable = 1
          }
          storage "file" {
            path = "/openbao/data"
          }
      dataStorage:
        enabled: true
        size: 1Gi
      ha:
        enabled: false
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits:   { cpu: 250m, memory: 256Mi }
    ui:
      enabled: true
      serviceType: ClusterIP
    injector:
      enabled: false        # not needed — ESO does the sync, not the sidecar injector
