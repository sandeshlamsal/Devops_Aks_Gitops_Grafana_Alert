# OpenBao — https://openbao.org  (MPL-2.0, Linux Foundation; the open-source fork of
# HashiCorp Vault after Vault went BSL). API-compatible with Vault, so the External
# Secrets Operator's `vault` provider talks to it unchanged.
#
# This is a single-node "standalone" deployment with file storage on a PVC. It comes up
# SEALED and must be initialised + unsealed once by hand after first install
# (see ../README.md → "Bootstrap OpenBao").
#
# Azure Key Vault auto-unseal was attempted (workload identity + Key Vault key
# `openbao-unseal` in `san-dev-secrets-kv`) and reverted: this chart's bundled
# `azurekeyvault` seal plugin only calls Azure's classic ManagedIdentityCredential
# (IMDS) — it never tries WorkloadIdentityCredential even though the pod has the
# correct AZURE_FEDERATED_TOKEN_FILE/AZURE_CLIENT_ID env vars injected, so it can't
# authenticate under AKS workload identity and crash-loops on "Identity not found".
# The OpenBao project's own release notes mark this built-in seal deprecated in favor
# of an external plugin, which likely fixes this — not pursued here. The Azure-side
# resources (openbao-unseal-id identity, its federated credential, and the Key Vault
# key) are left in place unused for a future retry. See ../README.md → "Auto-unseal"
# for the alternative that does work today: attach the identity at the AKS node pool
# (VMSS) level instead of via workload identity — trades pod-level isolation (any pod
# on the node could then call IMDS for this identity) for compatibility.
#
# Its own Flux Kustomization ("openbao"). Namespace: openbao.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: ">=0.10.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: openbao
  values:
    server:
      # chart default image is quay.io/openbao/openbao — don't override (a bare
      # repository: value gets the chart's registry prefixed, causing quay.io/quay.io/…)
      standalone:
        enabled: true
        config: |
          ui = true
          listener "tcp" {
            address     = "[::]:8200"
            tls_disable = 1
          }
          storage "file" {
            path = "/openbao/data"
          }
      dataStorage:
        enabled: true
        size: 1Gi
      ha:
        enabled: false
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits:   { cpu: 250m, memory: 256Mi }
    ui:
      enabled: true
      serviceType: ClusterIP
    injector:
      enabled: false        # not needed — ESO does the sync, not the sidecar injector
