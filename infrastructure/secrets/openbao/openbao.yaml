# OpenBao — https://openbao.org  (MPL-2.0, Linux Foundation; the open-source fork of
# HashiCorp Vault after Vault went BSL). API-compatible with Vault, so the External
# Secrets Operator's `vault` provider talks to it unchanged.
#
# This is a single-node "standalone" deployment with file storage on a PVC.
# Auto-unseal via Azure Key Vault (see ../README.md → "Auto-unseal (production)"):
# the root key is wrapped by Key Vault key `openbao-unseal` in `san-dev-secrets-kv`,
# using the `openbao-unseal-id` managed identity (federated to this chart's `openbao`
# ServiceAccount via the cluster's OIDC issuer). No Shamir shares, no manual unseal
# after restarts — `bao operator init` still runs once and prints *recovery* keys
# instead (break-glass only, not needed for routine startup).
#
# Its own Flux Kustomization ("openbao"). Namespace: openbao.
---
apiVersion: v1
kind: Namespace
metadata:
  name: openbao
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 1h
  url: https://openbao.github.io/openbao-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  chart:
    spec:
      chart: openbao
      version: ">=0.10.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: openbao
  values:
    server:
      # chart default image is quay.io/openbao/openbao — don't override (a bare
      # repository: value gets the chart's registry prefixed, causing quay.io/quay.io/…)
      serviceAccount:
        annotations:
          azure.workload.identity/client-id: "ac778187-d4c8-4966-8b39-ab938ee3a8f6"   # openbao-unseal-id
      extraLabels:
        azure.workload.identity/use: "true"
      standalone:
        enabled: true
        config: |
          ui = true
          listener "tcp" {
            address     = "[::]:8200"
            tls_disable = 1
          }
          storage "file" {
            path = "/openbao/data"
          }
          seal "azurekeyvault" {
            vault_name = "san-dev-secrets-kv"
            key_name   = "openbao-unseal"
            # tenant_id / client_id come from the workload-identity-federated pod
            # environment (AZURE_TENANT_ID / AZURE_CLIENT_ID) — no secret in config
          }
      dataStorage:
        enabled: true
        size: 1Gi
      ha:
        enabled: false
      resources:
        requests: { cpu: 50m, memory: 128Mi }
        limits:   { cpu: 250m, memory: 256Mi }
    ui:
      enabled: true
      serviceType: ClusterIP
    injector:
      enabled: false        # not needed — ESO does the sync, not the sidecar injector
