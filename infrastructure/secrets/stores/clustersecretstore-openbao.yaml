# Tells ESO how to reach OpenBao and authenticate. ClusterSecretStore = usable from any
# namespace (our ExternalSecrets create Secrets in `monitoring`).
#
# Auth is Kubernetes auth: ESO's ServiceAccount presents its token, OpenBao's
# `auth/kubernetes` backend validates it and maps the role "external-secrets" to a
# policy that can read `kv/data/monitoring/*`. No static token anywhere.
# The backend + role + policy are created once during bootstrap — see ../README.md.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: "http://openbao.openbao.svc:8200"
      path: "kv"                 # KV v2 mount
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
