# ALTERNATE backend: 1Password (via 1Password Connect). NOT applied by default — it is
# left out of ../kustomization.yaml because it needs a running 1Password Connect server
# and a Connect token that only you can provide. To use it:
#
#   1. Create a 1Password vault named "Kubernetes" with items:
#        - "gmail-smtp"     field: password
#        - "grafana-admin"  field: password
#   2. Generate 1password-credentials.json + a Connect token in the 1Password console.
#   3. Deploy 1Password Connect (helm: 1password/connect) into namespace `onepassword`,
#      or `kubectl create secret generic op-credentials --from-file=1password-credentials.json`.
#   4. kubectl create secret generic onepassword-connect-token -n external-secrets \
#        --from-literal=token='<CONNECT_TOKEN>'
#   5. Add this file to ../kustomization.yaml and point the ExternalSecrets'
#      secretStoreRef.name at "onepassword".
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.onepassword.svc:8080
      vaults:
        Kubernetes: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            namespace: external-secrets
            key: token
