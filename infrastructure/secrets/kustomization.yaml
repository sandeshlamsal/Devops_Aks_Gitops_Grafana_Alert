# Applied by the Flux Kustomization "secrets" — the SecretStore + the ExternalSecrets.
# dependsOn: external-secrets-operator (CRDs), openbao (backend), prometheus (monitoring ns).
#
# clustersecretstore-1password.yaml is intentionally NOT listed (optional alt backend —
# see stores/clustersecretstore-1password.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - stores/clustersecretstore-openbao.yaml
  - externalsecrets/gmail-smtp.yaml
  - externalsecrets/grafana-admin.yaml
