# Grafana admin password, out of git. ESO reads OpenBao  kv/monitoring/grafana-admin
# (field: password) and creates Secret `grafana-admin` in `monitoring`.
# infrastructure/grafana/grafana.yaml consumes it as env GF_SECURITY_ADMIN_PASSWORD and
# sets  admin_password: $__env{GF_SECURITY_ADMIN_PASSWORD}.
# Seed:  bao kv put kv/monitoring/grafana-admin password='<STRONG_PASSWORD>'
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: monitoring/grafana-admin
        property: password
