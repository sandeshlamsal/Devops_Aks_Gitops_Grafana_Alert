# Replaces the hand-run `kubectl create secret generic gmail-smtp-secret`.
# ESO reads OpenBao path  kv/monitoring/gmail-smtp  (field: password)  and creates/keeps
# a native Secret `gmail-smtp-secret` in `monitoring` — the exact name+key that
# infrastructure/alert/alertmanager-config.yaml references via authPassword.
# Seed the value once:  bao kv put kv/monitoring/gmail-smtp password='<GMAIL_APP_PASSWORD>'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gmail-smtp-secret
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: gmail-smtp-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: monitoring/gmail-smtp
        property: password
