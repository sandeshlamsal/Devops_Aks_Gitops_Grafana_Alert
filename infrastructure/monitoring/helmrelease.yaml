apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prom-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=60.0.0 <61.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  values:
    grafana:
      adminPassword: changeme123
      service:
        type: ClusterIP
    alertmanager:
      alertmanagerSpec:
        replicas: 1
        secrets:
          - gmail-smtp-secret
      config:
        global:
          resolve_timeout: 5m
          smtp_smarthost: "smtp.gmail.com:587"
          smtp_from: "sunwalsandesh@gmail.com"
          smtp_auth_username: "sunwalsandesh@gmail.com"
          smtp_auth_password_file: "/etc/alertmanager/secrets/gmail-smtp-secret/password"
          smtp_require_tls: true
        route:
          receiver: "email-notifications"
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1h
        receivers:
          - name: "null"
          - name: "email-notifications"
            email_configs:
              - to: "parasisandesh@hotmail.com"
                send_resolved: true
                headers:
                  subject: "[Alert] {{ .CommonAnnotations.summary }}"
                text: "{{ .CommonAnnotations.description }}"
    prometheus:
      prometheusSpec:
        retention: 5d
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            cpu: 150m
            memory: 400Mi
