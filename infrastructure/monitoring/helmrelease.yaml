apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prom-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ">=60.0.0 <61.0.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
      interval: 1h
  values:
    grafana:
      adminPassword: changeme123
      service:
        type: ClusterIP
    alertmanager:
      alertmanagerSpec:
        replicas: 1
        alertmanagerConfigSelector: {}
        alertmanagerConfigNamespaceSelector: {}
        alertmanagerConfigMatcherStrategy:
          type: None
      config:
        global:
          resolve_timeout: 5m
        route:
          receiver: "null"
        receivers:
          - name: "null"
    prometheus:
      prometheusSpec:
        retention: 5d
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            cpu: 150m
            memory: 400Mi
